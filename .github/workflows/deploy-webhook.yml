name: Deploy Webhook Receiver to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/GCP/webhook-receiver/**'
  workflow_dispatch: # Wyzwalacz ręczny

jobs:
  deploy:
    name: 'Build and Deploy to Cloud Run'
    runs-on: ubuntu-latest
    
    # Krytyczne uprawnienia dla WIF
    permissions:
      contents: 'read'
      id-token: 'write' 

    steps:
      - name: 'Checkout Repository'
        uses: 'actions/checkout@v4'

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: 'Deploy Webhook Service to Cloud Run'
        working-directory: 'Backend/GCP/webhook-receiver'
        run: |
          gcloud run deploy webhook-receiver \
            --source. \
            --region ${{ vars.GCP_REGION }} \
            --allow-unauthenticated \
            --quiet