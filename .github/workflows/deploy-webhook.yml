# ==============================================================================
# PROCES BUDOWANIA I WDRAZANIA ARCHITEKTURY CLOUD RUN V2 - NEUROATYPOWY
# Data aktualizacji: 02.03.2026 r.
# Region docelowy: europe-west1 (Belgium)
# Standard: ASCII, LF, No Hidden Chars, Separation of Logic and Comments
# ==============================================================================

name: Deploy Webhook to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/**'
      - '.github/workflows/deploy-webhook.yml'

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: europe-west1
  SERVICE_NAME: webhook-receiver
  IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID }}/webhook-receiver

jobs:
  deploy:
    name: Build and Deploy to Google Cloud
    runs-on: ubuntu-latest
    
    # Wymagane uprawnienia dla OIDC / Workload Identity Federation
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      # 1. Pobranie kodu z repozytorium
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Autoryzacja w Google Cloud za pomoca OIDC (Zalecane zamiast Service Account Key)
      # Wymaga ustawienia sekretow: GCP_WORKLOAD_IDENTITY_PROVIDER oraz GCP_SERVICE_ACCOUNT
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # 3. Konfiguracja narzedzia gcloud
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      # 4. Autoryzacja Docker do Artifact Registry / GCR
      - name: Docker Auth
        run: |-
          gcloud auth configure-docker --quiet

      # 5. Budowanie obrazu kontenera
      # Sciezka kontekstu: Backend/GCP/webhook-receiver
      - name: Build Docker Image
        run: |-
          docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} ./Backend/GCP/webhook-receiver

      # 6. Wyslanie obrazu do rejestru
      - name: Push Docker Image
        run: |-
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # 7. Wdrozenie do Cloud Run v2
      # Zastosowanie flagi --region europe-west1 zgodnie z wymogiem
      - name: Deploy to Cloud Run v2
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          flags: '--allow-unauthenticated'

      # 8. Wyswietlenie adresu URL uslugi
      - name: Show Service URL
        run: |-
          echo "Service is deployed at: ${{ steps.deploy.outputs.url }}"