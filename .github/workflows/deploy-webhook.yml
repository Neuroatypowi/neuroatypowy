name: Deploy Webhook Receiver to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/GCP/webhook-receiver/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write' # Kluczowe dla Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - id: 'auth'
        name: 'Authenticate to Google Cloud'
        uses: 'google-github-actions/auth@v2'
        with:
          # Format: projects/NUMER_PROJEKTU/locations/global/workloadIdentityPools/NAZWA_PULI/providers/NAZWA_PROVIDERA
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: 'Deploy to Cloud Run'
        working-directory: Backend/GCP/webhook-receiver
        run: |
          gcloud run deploy webhook-receiver \
            --source . \
            --region europe-west1 \
            --allow-unauthenticated \
            --quiet
