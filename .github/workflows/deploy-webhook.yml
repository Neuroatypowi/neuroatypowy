# ==============================================================================
# PROCES BUDOWANIA I WDRAZANIA ARCHITEKTURY - NEUROATYPOWY
# Cel: Cloud Run v2 w regionie europe-west1 (Belgia)
# Standard: 100% ASCII, LF, Rozdzial logiki od komentarzy
# Stan na dzien: 02.03.2026 r.
# ==============================================================================

name: Deploy Webhook to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/GCP/webhook-receiver/**'
      - '.github/workflows/deploy-webhook.yml'

env:
  # Bezwzglednie wymagany Region Google Cloud w Belgii
  REGION: europe-west1
  SERVICE_NAME: webhook-receiver
  # Sciezka do kodu aplikacji wewnatrz repozytorium
  WORKING_DIR: Backend/GCP/webhook-receiver

jobs:
  deploy:
    name: Build and Deploy to Google Cloud
    runs-on: ubuntu-latest
    
    # Wymagane dla bezpiecznej autoryzacji Workload Identity Federation
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      # 1. Pobranie kodu z ograniczeniem do wymaganych katalogow
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Autoryzacja w GCP
      # Uwaga: Nalezy upewnic sie, ze sekrety sa zdefiniowane w GitHub Actions
      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # 3. Konfiguracja SDK i Docker
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Docker Auth
        run: |-
          gcloud auth configure-docker --quiet

      # 4. Budowanie i wypychanie obrazu
      # Wykorzystanie ID projektu z autoryzacji zapobiega bledom pustego tagu
      - name: Build and Push Container
        run: |-
          IMAGE_TAG="gcr.io/${{ steps.auth.outputs.project_id }}/${{ env.SERVICE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" ${{ env.WORKING_DIR }}
          docker push "$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      # 5. Wdrozenie do Cloud Run v2 (Region: europe-west1)
      - name: Deploy to Cloud Run v2
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE_ENV }}
          flags: '--allow-unauthenticated'

      # 6. Finalna weryfikacja
      - name: Show Service URL
        run: |-
          echo "Wdrozenie zakonczone sukcesem."
          echo "URL: ${{ steps.deploy.outputs.url }}"