name: Deploy Webhook Receiver

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/GCP/webhook-receiver/**'
  workflow_dispatch:

env:
  REGION: europe-west1
  SERVICE: webhook-receiver
  REGISTRY: europe-west1-docker.pkg.dev
  REPO: webhook-receiver

jobs:
  deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # Step 1: Download code from repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Login to Google Cloud using Secret Key
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # Step 3: Configure gcloud command line tool
      - name: Setup GCP CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Step 4: Login to Artifact Registry
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGISTRY }} --quiet

      # Step 5: Build Docker image in the cloud
      - name: Build Docker image
        working-directory: Backend/GCP/webhook-receiver
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:${{ github.sha }}"
          docker build --tag "$IMAGE" --tag "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:latest" .
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      # Step 6: Upload image to Google
      - name: Push image to Artifact Registry
        run: |
          docker push "${{ env.IMAGE }}"
          docker push "${{ env.REGISTRY }}/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO }}/${{ env.SERVICE }}:latest"

      # Step 7: Launch the application on Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image="${{ env.IMAGE }}" \
            --region=${{ env.REGION }} \
            --platform=managed \
            --min-instances=1 \
            --max-instances=10 \
            --memory=256Mi \
            --cpu=1 \
            --concurrency=80 \
            --timeout=60 \
            --cpu-boost \
            --allow-unauthenticated \
            --service-account="webhook-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com" \
            --set-secrets="MAILERSEND_SIGNING_SECRET=MAILERSEND_SIGNING_SECRET:latest" \
            --quiet

      # Step 8: Retrieve the final web address
      - name: Get Cloud Run URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} --region=${{ env.REGION }} --format='value(status.url)')
          echo "Service deployed at: $URL/webhook"
          echo "SERVICE_URL=$URL" >> $GITHUB_ENV

      # Step 9: Final verification ping
      - name: Verify service health
        run: |
          sleep 5
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ env.SERVICE_URL }}/")
          if [ "$STATUS" = "200" ]; then
            echo "Health check OK (HTTP 200)"
          else
            echo "Health check FAILED (HTTP $STATUS)"
            exit 1
          fi